<title>منصة Mme Maha Gafar التعليمية | تسجيل دخول الطالب</title>

<link rel="apple-touch-icon" href="logo.png" />

<style>
:root {
  --france-blue: #0055A4;
  --france-blue-light: #E3F2FD;
  --france-blue-dark: #003366;
  --white: #FFFFFF;
  --text-dark: #1A1A2E;
  --text-muted: #6B7B8D;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }
html { width:100%; }
body { width:100%; min-height:100vh; }
body {
  background: linear-gradient(145deg, var(--france-blue-light) 0%, #BBDEFB 100%);
  display:flex; justify-content:center; align-items:center; padding:20px; position:relative;
}

@keyframes floatIn { 0%{opacity:0;transform:translateY(60px) scale(0.9);} 100%{opacity:1;transform:translateY(0) scale(1);} }
@keyframes fadeInUp { 0%{opacity:0;transform:translateY(30px);} 100%{opacity:1;transform:translateY(0);} }
@keyframes floatY { 0%,100%{transform:translateY(0px);} 50%{transform:translateY(-10px);} }
@keyframes spinBorder { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
@keyframes borderGlow { 0%,100%{border-color:rgba(0,85,164,0.3);} 50%{border-color:rgba(0,85,164,0.8);} }
@keyframes shake { 0%,100%{transform:translateX(0);} 10%,30%,50%,70%,90%{transform:translateX(-5px);} 20%,40%,60%,80%{transform:translateX(5px);} }
@keyframes bounceIn { 0%{opacity:0;transform:scale(0.3);} 50%{opacity:1;transform:scale(1.05);} 70%{transform:scale(0.9);} 100%{transform:scale(1);} }
@keyframes scaleIn { 0%{opacity:0;transform:scale(0.8);} 100%{opacity:1;transform:scale(1);} }
@keyframes blobMove {
  0%,100%{transform:translate(0,0) scale(1) rotate(0deg);border-radius:42% 58% 65% 35%/45% 40% 60% 55%;}
  50%{transform:translate(-3vw,4vh) scale(0.92) rotate(-15deg);border-radius:35% 65% 55% 45%/40% 55% 45% 60%;}
}

.blob-bg { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.blob { position:absolute; filter:blur(50px); opacity:0.3; animation:blobMove 16s ease-in-out infinite; }
.blob:nth-child(1){width:38vw;height:38vw;top:-10%;left:-8%;background:radial-gradient(circle at 30% 30%,#A2D9FF,var(--france-blue));}
.blob:nth-child(2){width:30vw;height:30vw;bottom:-12%;right:-6%;background:radial-gradient(circle at 60% 40%,var(--france-blue-light),#A2D9FF);animation-duration:22s;}
.blob:nth-child(3){width:26vw;height:26vw;top:35%;right:15%;background:radial-gradient(circle at 40% 60%,#BBDEFB,var(--france-blue));animation-duration:20s;}

.floating-decor { position:fixed; font-size:50px; opacity:0.08; pointer-events:none; z-index:0; animation:floatY 6s ease-in-out infinite; }
.floating-decor:nth-child(1){top:5%;left:2%;font-size:70px;color:var(--france-blue);}
.floating-decor:nth-child(2){bottom:8%;right:2%;font-size:80px;animation-delay:1.5s;color:var(--france-blue-dark);}
.floating-decor:nth-child(3){top:50%;left:1%;font-size:40px;animation-delay:3s;color:var(--france-blue);}
.floating-decor:nth-child(4){top:30%;right:1%;font-size:55px;animation-delay:2s;color:var(--france-blue-dark);}

.container {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  border-radius: 40px;
  padding: 45px 40px 40px;
  max-width: 560px; width:100%;
  box-shadow: 0 25px 60px rgba(0,85,164,0.2), inset 0 1px 3px rgba(255,255,255,0.8);
  border: 1px solid rgba(255,255,255,0.6);
  position: relative; z-index: 2; margin: 20px auto;
  animation: floatIn 0.8s cubic-bezier(0.34,1.56,0.64,1);
}

.back-btn {
  position: absolute; top: 18px; right: 18px;
  background: rgba(0,85,164,0.1); color: var(--france-blue);
  border: none; padding: 8px 16px; border-radius: 60px;
  cursor: pointer; font-weight: 700; font-size: 13px;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.3s ease; font-family: inherit;
}
.back-btn:hover { background: var(--france-blue); color: white; transform: translateX(-3px); }

.logo { text-align: center; margin-bottom: 24px; }
.logo-wrapper {
  display: inline-block;
  background: linear-gradient(135deg, var(--france-blue), var(--france-blue-dark));
  border-radius: 50%; padding: 10px;
  box-shadow: 0 8px 25px rgba(0,85,164,0.35);
  position: relative;
}
.logo-wrapper::after {
  content:''; position:absolute; inset:-5px; border-radius:50%;
  border:3px solid rgba(0,85,164,0.3);
  animation: borderGlow 2s ease-in-out infinite;
}
.logo-wrapper::before {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  background: conic-gradient(from 0deg, var(--france-blue), var(--white), var(--france-blue-dark), var(--white), var(--france-blue));
  opacity:0.7; animation: spinBorder 6s linear infinite; z-index:-1; filter:blur(2px);
}
.logo-img {
  width: 80px; height: 80px; background: white; border-radius: 50%;
  display:block; object-fit: contain; padding: 4px;
  animation: floatY 3s ease-in-out infinite;
  position: relative; z-index: 1;
}

.logo h1 { font-size: 22px; margin-top: 12px; color:var(--text-dark); font-weight:800; animation: fadeInUp 1s ease-out 0.3s both; }
.logo h1 span { color:var(--france-blue); }
.logo p { color:var(--text-muted); font-size:13px; font-weight:500; margin-top:4px; animation: fadeInUp 1s ease-out 0.5s both; }

.form-group { margin-bottom: 18px; animation: fadeInUp 0.6s ease-out both; }
.form-group:nth-child(1){animation-delay:0.1s;}
.form-group:nth-child(2){animation-delay:0.2s;}

.form-group label { display:block; font-weight:700; color:var(--text-dark); margin-bottom:6px; font-size:14px; }
.form-group label .icon { margin-left:6px; display:inline-block; transition: transform 0.3s ease; }
.form-group:hover label .icon { transform: scale(1.2) rotate(-10deg); }

.form-group input {
  width: 100%; padding: 14px 18px;
  border: 2px solid #BBDEFB; border-radius: 16px;
  font-size: 15px; transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  background: #F0F8FF; color: var(--text-dark); text-align: right; font-family: inherit;
}
.form-group input:focus {
  border-color: var(--france-blue); outline: none;
  box-shadow: 0 0 0 5px rgba(0,85,164,0.15), 0 8px 25px rgba(0,85,164,0.1);
  background: white; transform: scale(1.01);
}

.btn-primary {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, var(--france-blue), var(--france-blue-dark));
  color: white; border: none; border-radius: 60px;
  font-size: 18px; font-weight: 800; cursor: pointer;
  transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  margin-top: 10px; box-shadow: 0 6px 25px rgba(0,85,164,0.4);
  font-family: inherit; letter-spacing: 0.5px;
}
.btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 35px rgba(0,85,164,0.55); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary.shake-btn { animation: shake 0.5s ease; }

.link-row { text-align: center; margin-top: 18px; color: var(--text-muted); font-size: 14px; font-weight: 500; }
.link-row a { color: var(--france-blue); font-weight: 700; text-decoration: none; cursor: pointer; transition: all 0.3s ease; }
.link-row a:hover { color: var(--france-blue-dark); text-decoration: underline; }

.message {
  text-align: center; margin-top: 16px; padding: 12px 18px;
  border-radius: 16px; display: none; font-weight: 600; font-size: 14px;
  animation: scaleIn 0.4s ease-out;
}
.message.error { display:block; background:#fff0f0; color:#c0392b; border:2px solid #fdd; animation: shake 0.5s ease; }
.message.success { display:block; background:#e6f7ee; color:#1a7a42; border:2px solid #b8e6cf; animation: bounceIn 0.6s ease; }

@media (max-width:480px){
  .container{padding:36px 22px;}
  .logo h1{font-size:18px;}
  .logo-img{width:70px;height:70px;}
  .floating-decor{display:none;}
}


/* ================================================================
   PRO ENHANCEMENT PACK — extra motion, polish & eye-catching detail
   ================================================================ */
html { scroll-behavior: smooth; }

@keyframes pageFadeIn { 0%{opacity:0;} 100%{opacity:1;} }
body.__pro_ready { animation: pageFadeIn .7s ease both; }

@keyframes shimmerText {
  0%   { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
.logo h1 span {
  background: linear-gradient(90deg, var(--france-blue) 0%, #7ec8ff 25%, var(--france-blue) 50%, #7ec8ff 75%, var(--france-blue) 100%);
  background-size: 300% auto;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: shimmerText 4.5s linear infinite;
}


@keyframes rippleFx { to { transform: scale(3.2); opacity: 0; } }
.pro-ripple {
  position:absolute; border-radius:50%; pointer-events:none;
  background: rgba(255,255,255,.55); transform: scale(0);
  animation: rippleFx .65s ease-out;
}
button, .btn-primary, .choice-btn, .btn-logout, .icon-card {
  position: relative; overflow: hidden;
}

@keyframes cardTiltIn {
  0%   { opacity:0; transform: perspective(800px) rotateX(8deg) translateY(35px) scale(.94); }
  100% { opacity:1; transform: perspective(800px) rotateX(0) translateY(0) scale(1); }
}
.container, .welcome-section, .my-stage-banner, .stat-card, .content-card {
  animation: cardTiltIn .7s cubic-bezier(.22,1,.36,1) both;
}

@keyframes glowPulseSoft {
  0%,100% { box-shadow: 0 0 0 rgba(0,0,0,0); }
  50% { box-shadow: 0 0 28px rgba(0,85,164,.2); }
}
.btn-primary, .choice-btn { animation: glowPulseSoft 3.2s ease-in-out infinite; }

/* micro-interaction: gentle lift + glow on any interactive icon card */
.icon-card, .choice-btn, .btn-primary {
  transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease, filter .35s ease;
}
.icon-card:hover, .choice-btn:hover { filter: brightness(1.04) saturate(1.08); }

/* smoother, more premium focus ring */
input:focus, select:focus, textarea:focus {
  outline: none;
}


/* scrollbar polish */

/* ===== إظهار / إخفاء كلمة المرور ===== */
.pw-wrap{position:relative;}
.form-group .pw-wrap input{padding-left:52px;}
.pw-wrap .pw-toggle{
  position:absolute; left:8px; top:50%; transform:translateY(-50%);
  width:38px; height:38px; border:none; border-radius:50%;

.pw-wrap .pw-toggle:focus-visible{outline:2px solid var(--france-blue);outline-offset:2px;}
.field-hint{font-size:12px;color:var(--text-muted);margin-top:5px;padding-right:5px;}

/* رسالة لطيفة + زرار التواصل */
.message.info { display:block; background:#FFF8E6; color:#7a5200; border:2px solid #FFE3A3; animation: bounceIn 0.6s ease; line-height:1.9; }
.message .msg-sub { font-size:13px; font-weight:600; margin-top:4px; opacity:.9; }
.contact-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; padding:10px 22px; border-radius:60px; text-decoration:none; font-weight:800; font-size:14px; color:#fff; background:linear-gradient(135deg,var(--france-blue),var(--france-blue-dark)); box-shadow:0 6px 18px rgba(0,85,164,.3); transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
.contact-btn:hover { transform:translateY(-2px) scale(1.03); }
.forgot-box { margin-top:22px; padding:14px 16px; border-radius:18px; background:var(--france-blue-light); text-align:center; font-size:13px; line-height:1.9; color:var(--text-dark); }
.forgot-box b { display:block; font-size:14px; color:var(--france-blue-dark); margin-bottom:2px; }
.forgot-box .contact-btn { margin-top:8px; padding:8px 18px; font-size:13px; }
</style>

<body>

<div class="blob-bg"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
<div class="floating-decor">🌸</div>
<div class="floating-decor">📚</div>
<div class="floating-decor">✨</div>
<div class="floating-decor">🎓</div>

<div class="container">
  <button class="back-btn" onclick="window.location.href='index.html'">← رجوع</button>

  <div class="logo">
    <div class="logo-wrapper">
      <img src="logo.png" alt="Mme Maha Gafar" class="logo-img" />
    </div>
    <h1>تسجيل دخول <span>الطالب</span></h1>
    <p>🔐 تسجيل الدخول لمتابعة الدروس</p>
  </div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label><span class="icon">📱</span> رقم الهاتف (واتساب)</label>
      <input type="tel" id="loginPhone" placeholder="رقم الهاتف" required inputmode="tel" maxlength="16" autocomplete="tel" />
    </div>
    <div class="form-group">
      <label><span class="icon">🔒</span> كلمة المرور</label>
      <div class="pw-wrap">
        <input type="password" id="loginPassword" placeholder="كلمة المرور" required autocomplete="current-password" />
        <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="إظهار كلمة المرور" aria-pressed="false"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <button type="submit" class="btn-primary">🔐 تسجيل الدخول</button>
    <div id="loginMessage" class="message"></div>
  </form>

  <div class="forgot-box">
    <b>🔑 نسيت كلمة المرور؟</b>
    <a class="contact-btn" id="forgotContact" href="#" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp"></i> تواصل مع المعلمة</a>
  </div>

  <div class="link-row">
    ليس لديك حساب؟ <a onclick="window.location.href='student-signup.html'">تسجيل جديد</a>
  </div>
</div>

<script src="api.js"></script>
<script>
/* ===== أدوات التحقق ===== */
/* الأرقام العربية (٠١٢) والفارسية (۰۱۲) ← أرقام إنجليزية */
function toEnglishDigits(s) {
  return String(s == null ? '' : s)
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0));
}
/* أي رقم هاتف (مصري أو دولي): بنشيل الرموز والمسافات ونحوّل الأرقام العربية */
function normalizePhone(v) {
  let p = toEnglishDigits(v).replace(/\D/g, '');
  const m = p.match(/^(?:00)?20(1[0125]\d{8})$/);
  if (m) p = '0' + m[1];                       // مصري بكود الدولة -> 01xxxxxxxxx
  else if (/^1[0125]\d{8}$/.test(p)) p = '0' + p;
  else if (p.startsWith('00')) p = p.slice(2);  // 00 = علامة + الدولية
  return p;
}
function isValidPhone(p) { return /^\d{7,15}$/.test(p); }

function bindDigitFields(ids) {
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', () => {
      const v = toEnglishDigits(el.value);
      if (v !== el.value) {
        const pos = el.selectionStart;
        el.value = v;
        try { el.setSelectionRange(pos, pos); } catch (_) {}
      }
    });
  });
}

function togglePw(btn) {
  const inp = btn.parentElement.querySelector('input');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
  btn.setAttribute('aria-label', show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
  btn.setAttribute('aria-pressed', String(show));
}
/* واتساب المعلمة (الرقم بكود الدولة من غير + أو صفر في الأول) */
const TEACHER_CONTACT_URL = 'https://wa.me/201221811520';

function showMsg(msg, text, type) { msg.textContent = text; msg.className = 'message ' + type; }
function contactBtnHtml() {
  return '<a class="contact-btn" href="' + TEACHER_CONTACT_URL + '" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp"></i> تواصل مع المعلمة</a>';
}
function showPendingMsg(msg) {
  msg.className = 'message info';
  msg.innerHTML = '<div>🌸 أهلاً بك! تم استلام طلب حسابك وهو بانتظار موافقة المعلمة.</div>' +
    '<div class="msg-sub">سيتم السماح بالدخول فور الموافقة، وللاستعجال يمكن التواصل مع المعلمة.</div>' + contactBtnHtml();
}
function showRejectedMsg(msg) {
  msg.className = 'message info';
  msg.innerHTML = '<div>🌸 مش قادرين نفتح حسابك دلوقتي.</div>' +
    '<div class="msg-sub">يرجى التواصل مع المعلمة لمعرفة السبب وحل المشكلة.</div>' + contactBtnHtml();
}
document.addEventListener('DOMContentLoaded', function () {
  var a = document.getElementById('forgotContact');
  if (a) a.href = TEACHER_CONTACT_URL;
});

function shake(btn) {
  if (!btn) return;
  btn.classList.add('shake-btn');
  setTimeout(() => btn.classList.remove('shake-btn'), 500);
}

async function handleLogin(e) {
  e.preventDefault();
  const msg = document.getElementById('loginMessage');
  const submitBtn = e.target.querySelector('.btn-primary');
  const phone = normalizePhone(document.getElementById('loginPhone').value);
  const password = document.getElementById('loginPassword').value.trim();

  if (!phone || !password) { showMsg(msg, '⚠️ يرجى ملء جميع الحقول', 'error'); return; }
  if (!isValidPhone(phone)) {
    showMsg(msg, '⚠️ رقم الهاتف غير صحيح — يرجى كتابة الرقم بشكل صحيح (من 7 إلى 15 رقم)', 'error'); return;
  }

  const label = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = '⏳ جاري التحقق...';
  msg.className = 'message';

  let r;
  try {
    r = await API.studentLogin({ phone, password });
  } catch (err) {
    showMsg(msg, '❌ ' + err.message, 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = label;
    shake(submitBtn);
    return;
  }
  submitBtn.textContent = label;

  if (r.status !== 'approved') {
    submitBtn.disabled = false;
    if (r.status === 'pending') showPendingMsg(msg); else showRejectedMsg(msg);
    return;
  }

  showMsg(msg, '✅ تم تسجيل الدخول بنجاح! جاري التحويل...', 'success');
  setToken(r.token);
  safeSet('currentUser', JSON.stringify(r.student));
  safeSet('userRole', 'student');
  setTimeout(() => { window.location.href = 'student-dashboard.html'; }, 700);
}

bindDigitFields(['loginPhone']);
</script>


<script>
/* ================= PRO ENHANCEMENT: particles + ripple + fade-in ================= */
(function(){
  document.body.classList.add('__pro_ready');


  document.addEventListener('pointerdown', function(e){
    var target = e.target.closest('button, .choice-btn, .icon-card, .btn-primary, .btn-logout');
    if (!target) return;
    var rect = target.getBoundingClientRect();
    var span = document.createElement('span');
    span.className = 'pro-ripple';
    var size = Math.max(rect.width, rect.height);
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size / 2) + 'px';
    span.style.top = (e.clientY - rect.top - size / 2) + 'px';
    target.appendChild(span);
    setTimeout(function(){ span.remove(); }, 700);
  });
})();
</script>
