<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>منصة Mme Maha Gafar التعليمية | تسجيل دخول المعلمة</title>
<link rel="icon" type="image/png" href="logo.png" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root {
  --france-red: #EF4135;
  --france-red-light: #FFEBEE;
  --france-red-dark: #B71C1C;
  --white: #FFFFFF;
  --text-dark: #1A1A2E;
  --text-muted: #6B7B8D;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }
html { width:100%; }
body { width:100%; min-height:100vh; }
body {
  background: linear-gradient(145deg, var(--france-red-light) 0%, #FFCDD2 100%);
  display:flex; justify-content:center; align-items:center; padding:20px; position:relative;
}

@keyframes floatIn { 0%{opacity:0;transform:translateY(60px) scale(0.9);} 100%{opacity:1;transform:translateY(0) scale(1);} }
@keyframes fadeInUp { 0%{opacity:0;transform:translateY(30px);} 100%{opacity:1;transform:translateY(0);} }
@keyframes floatY { 0%,100%{transform:translateY(0px);} 50%{transform:translateY(-10px);} }
@keyframes spinBorder { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
@keyframes borderGlow { 0%,100%{border-color:rgba(239,65,53,0.3);} 50%{border-color:rgba(239,65,53,0.8);} }
@keyframes shake { 0%,100%{transform:translateX(0);} 10%,30%,50%,70%,90%{transform:translateX(-5px);} 20%,40%,60%,80%{transform:translateX(5px);} }
@keyframes bounceIn { 0%{opacity:0;transform:scale(0.3);} 50%{opacity:1;transform:scale(1.05);} 70%{transform:scale(0.9);} 100%{transform:scale(1);} }
@keyframes scaleIn { 0%{opacity:0;transform:scale(0.8);} 100%{opacity:1;transform:scale(1);} }
@keyframes blobMove {
  0%,100%{transform:translate(0,0) scale(1) rotate(0deg);border-radius:42% 58% 65% 35%/45% 40% 60% 55%;}
  50%{transform:translate(-3vw,4vh) scale(0.92) rotate(-15deg);border-radius:35% 65% 55% 45%/40% 55% 45% 60%;}
}

.blob-bg { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.blob { position:absolute; filter:blur(50px); opacity:0.3; animation:blobMove 16s ease-in-out infinite; }
.blob:nth-child(1){width:38vw;height:38vw;top:-10%;left:-8%;background:radial-gradient(circle at 30% 30%,#FFD1DC,var(--france-red));}
.blob:nth-child(2){width:30vw;height:30vw;bottom:-12%;right:-6%;background:radial-gradient(circle at 60% 40%,#FFE4E1,var(--france-red-light));animation-duration:22s;}
.blob:nth-child(3){width:26vw;height:26vw;top:35%;right:15%;background:radial-gradient(circle at 40% 60%,#FFCDD2,var(--france-red));animation-duration:20s;}

.floating-decor { position:fixed; font-size:50px; opacity:0.08; pointer-events:none; z-index:0; animation:floatY 6s ease-in-out infinite; }
.floating-decor:nth-child(1){top:5%;left:2%;font-size:70px;color:var(--france-red);}
.floating-decor:nth-child(2){bottom:8%;right:2%;font-size:80px;animation-delay:1.5s;color:var(--france-red-dark);}
.floating-decor:nth-child(3){top:50%;left:1%;font-size:40px;animation-delay:3s;color:var(--france-red);}
.floating-decor:nth-child(4){top:30%;right:1%;font-size:55px;animation-delay:2s;color:var(--france-red-dark);}

.container {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  border-radius: 40px;
  padding: 45px 40px 40px;
  max-width: 560px; width:100%;
  box-shadow: 0 25px 60px rgba(239,65,53,0.2), inset 0 1px 3px rgba(255,255,255,0.8);
  border: 1px solid rgba(255,255,255,0.6);
  position: relative; z-index: 2; margin: 20px auto;
  animation: floatIn 0.8s cubic-bezier(0.34,1.56,0.64,1);
}

.back-btn {
  position: absolute; top: 18px; right: 18px;
  background: rgba(239,65,53,0.1); color: var(--france-red);
  border: none; padding: 8px 16px; border-radius: 60px;
  cursor: pointer; font-weight: 700; font-size: 13px;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.3s ease; font-family: inherit;
}
.back-btn:hover { background: var(--france-red); color: white; transform: translateX(-3px); }

.logo { text-align: center; margin-bottom: 24px; }
.logo-wrapper {
  display: inline-block;
  background: linear-gradient(135deg, var(--france-red), var(--france-red-dark));
  border-radius: 50%; padding: 10px;
  box-shadow: 0 8px 25px rgba(239,65,53,0.35);
  position: relative;
}
.logo-wrapper::after {
  content:''; position:absolute; inset:-5px; border-radius:50%;
  border:3px solid rgba(239,65,53,0.3);
  animation: borderGlow 2s ease-in-out infinite;
}
.logo-wrapper::before {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  background: conic-gradient(from 0deg, var(--france-red), var(--white), var(--france-red-dark), var(--white), var(--france-red));
  opacity:0.7; animation: spinBorder 6s linear infinite; z-index:-1; filter:blur(2px);
}
.logo-img {
  width: 80px; height: 80px; background: white; border-radius: 50%;
  display:block; object-fit: contain; padding: 4px;
  animation: floatY 3s ease-in-out infinite;
  position: relative; z-index: 1;
}

.logo h1 { font-size: 22px; margin-top: 12px; color:var(--text-dark); font-weight:800; animation: fadeInUp 1s ease-out 0.3s both; }
.logo h1 span { color:var(--france-red); }
.logo p { color:var(--text-muted); font-size:13px; font-weight:500; margin-top:4px; animation: fadeInUp 1s ease-out 0.5s both; }

.form-group { margin-bottom: 18px; animation: fadeInUp 0.6s ease-out both; }
.form-group:nth-child(1){animation-delay:0.1s;}

.form-group label { display:block; font-weight:700; color:var(--text-dark); margin-bottom:6px; font-size:14px; }
.form-group label .icon { margin-left:6px; display:inline-block; transition: transform 0.3s ease; }
.form-group:hover label .icon { transform: scale(1.2) rotate(-10deg); }

.form-group input {
  width: 100%; padding: 14px 18px;
  border: 2px solid #FFCDD2; border-radius: 16px;
  font-size: 15px; transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  background: #FFF5F5; color: var(--text-dark); text-align: right; font-family: inherit;
}
.form-group input:focus {
  border-color: var(--france-red); outline: none;
  box-shadow: 0 0 0 5px rgba(239,65,53,0.15), 0 8px 25px rgba(239,65,53,0.1);
  background: white; transform: scale(1.01);
}

.btn-primary {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, var(--france-red), var(--france-red-dark));
  color: white; border: none; border-radius: 60px;
  font-size: 18px; font-weight: 800; cursor: pointer;
  transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  margin-top: 10px; box-shadow: 0 6px 25px rgba(239,65,53,0.4);
  font-family: inherit; letter-spacing: 0.5px;
}
.btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 35px rgba(239,65,53,0.55); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary.shake-btn { animation: shake 0.5s ease; }

.message {
  text-align: center; margin-top: 16px; padding: 12px 18px;
  border-radius: 16px; display: none; font-weight: 600; font-size: 14px;
  animation: scaleIn 0.4s ease-out;
}
.message.error { display:block; background:#fff0f0; color:#c0392b; border:2px solid #fdd; animation: shake 0.5s ease; }
.message.success { display:block; background:#e6f7ee; color:#1a7a42; border:2px solid #b8e6cf; animation: bounceIn 0.6s ease; }

.hint { text-align:center; margin-top: 14px; color:var(--text-muted); font-size:12px; font-weight:500; }
.hint code { background: rgba(239,65,53,0.15); padding: 3px 10px; border-radius: 20px; color: var(--france-red); font-weight: 700; }

@media (max-width:480px){
  .container{padding:36px 22px;}
  .logo h1{font-size:18px;}
  .logo-img{width:70px;height:70px;}
  .floating-decor{display:none;}
}


/* ================================================================
   PRO ENHANCEMENT PACK — extra motion, polish & eye-catching detail
   ================================================================ */
html { scroll-behavior: smooth; }

@keyframes pageFadeIn { 0%{opacity:0;} 100%{opacity:1;} }
body.__pro_ready { animation: pageFadeIn .7s ease both; }

@keyframes shimmerText {
  0%   { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
.logo h1 span {
  background: linear-gradient(90deg, var(--france-red) 0%, #7ec8ff 25%, var(--france-red) 50%, #7ec8ff 75%, var(--france-red) 100%);
  background-size: 300% auto;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: shimmerText 4.5s linear infinite;
}


@keyframes rippleFx { to { transform: scale(3.2); opacity: 0; } }
.pro-ripple {
  position:absolute; border-radius:50%; pointer-events:none;
  background: rgba(255,255,255,.55); transform: scale(0);
  animation: rippleFx .65s ease-out;
}
button, .btn-primary, .choice-btn, .btn-logout, .icon-card {
  position: relative; overflow: hidden;
}

@keyframes cardTiltIn {
  0%   { opacity:0; transform: perspective(800px) rotateX(8deg) translateY(35px) scale(.94); }
  100% { opacity:1; transform: perspective(800px) rotateX(0) translateY(0) scale(1); }
}
.container, .welcome-section, .my-stage-banner, .stat-card, .content-card {
  animation: cardTiltIn .7s cubic-bezier(.22,1,.36,1) both;
}

@keyframes glowPulseSoft {
  0%,100% { box-shadow: 0 0 0 rgba(0,0,0,0); }
  50% { box-shadow: 0 0 28px rgba(239,65,53,.2); }
}
.btn-primary, .choice-btn { animation: glowPulseSoft 3.2s ease-in-out infinite; }

/* micro-interaction: gentle lift + glow on any interactive icon card */
.icon-card, .choice-btn, .btn-primary {
  transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease, filter .35s ease;
}
.icon-card:hover, .choice-btn:hover { filter: brightness(1.04) saturate(1.08); }

/* smoother, more premium focus ring */
input:focus, select:focus, textarea:focus {
  outline: none;
}


/* scrollbar polish */






/* ===== Scrollbar (fixed) ===== */
html{overflow-x:hidden;}
body{overflow-x:visible;}
::-webkit-scrollbar{width:12px;height:12px;}
::-webkit-scrollbar-track{background:#FFEBEE;border-radius:12px;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#EF4135,#B71C1C);border-radius:12px;border:3px solid #FFEBEE;min-height:48px;}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#B71C1C,#B71C1C);}
::-webkit-scrollbar-corner{background:transparent;}
@supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin;scrollbar-color:#EF4135 #FFEBEE;} }
::selection{background:rgba(239,65,53,.35);color:inherit;}

/* ===== إظهار / إخفاء كلمة المرور ===== */
.pw-wrap{position:relative;}
.form-group .pw-wrap input{padding-left:52px;}
.pw-wrap .pw-toggle{
  position:absolute; left:8px; top:50%; transform:translateY(-50%);
  width:38px; height:38px; border:none; border-radius:50%;
  background:transparent; color:var(--france-red); cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  transition:background .25s ease, transform .25s ease;
}
.pw-wrap .pw-toggle:hover{background:rgba(239,65,53,.12);}
.pw-wrap .pw-toggle:active{transform:translateY(-50%) scale(.9);}
.pw-wrap .pw-toggle:focus-visible{outline:2px solid var(--france-red);outline-offset:2px;}
.field-hint{font-size:12px;color:var(--text-muted);margin-top:5px;padding-right:5px;}
</style>
</head>
<body>

<div class="blob-bg"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
<div class="floating-decor">🌸</div>
<div class="floating-decor">📚</div>
<div class="floating-decor">✨</div>
<div class="floating-decor">🎓</div>

<div class="container">
  <button class="back-btn" onclick="window.location.href='index.html'">← رجوع</button>

  <div class="logo">
    <div class="logo-wrapper">
      <img src="logo.png" alt="Mme Maha Gafar" class="logo-img" />
    </div>
    <h1>تسجيل دخول <span>المعلمة</span></h1>
    <p>🔐 منطقة المعلمة - دخول خاص</p>
  </div>

  <form id="teacherForm" onsubmit="handleTeacherLogin(event)">
    <div class="form-group">
      <label><span class="icon">🔑</span> كلمة مرور المعلمة</label>
      <div class="pw-wrap">
        <input type="password" id="teacherPassword" placeholder="أدخل كلمة المرور" required autocomplete="current-password" />
        <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="إظهار كلمة المرور" aria-pressed="false"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <button type="submit" class="btn-primary">🔐 تسجيل الدخول</button>
    <div id="teacherMessage" class="message"></div>
  </form>

  <div class="hint">🔒 صفحة محمية — للاستخدام الشخصي فقط</div>
</div>

<script src="api.js"></script>
<script>
function togglePw(btn) {
  const inp = btn.parentElement.querySelector('input');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
  btn.setAttribute('aria-label', show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
  btn.setAttribute('aria-pressed', String(show));
}

async function handleTeacherLogin(e) {
  e.preventDefault();
  const password = document.getElementById('teacherPassword').value.trim();
  const msg = document.getElementById('teacherMessage');
  const submitBtn = e.target.querySelector('.btn-primary');
  if (!password) { msg.textContent = '⚠️ اكتبي كلمة المرور'; msg.className = 'message error'; return; }

  const label = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = '⏳ جاري التحقق...';
  msg.className = 'message';

  let r;
  try {
    r = await API.teacherLogin({ password });
  } catch (err) {
    msg.textContent = '❌ ' + err.message;
    msg.className = 'message error';
    submitBtn.disabled = false;
    submitBtn.textContent = label;
    submitBtn.classList.add('shake-btn');
    setTimeout(() => submitBtn.classList.remove('shake-btn'), 500);
    return;
  }

  submitBtn.textContent = label;
  msg.textContent = '✅ مرحباً Mme Maha Gafar! جاري التحويل...';
  msg.className = 'message success';
  setToken(r.token);
  localStorage.setItem('userRole', 'teacher');
  localStorage.setItem('teacherLoggedIn', 'true');
  setTimeout(() => { window.location.href = 'teacher-dashboard.html'; }, 700);
}
</script>


<script>
/* ================= PRO ENHANCEMENT: particles + ripple + fade-in ================= */
(function(){
  document.body.classList.add('__pro_ready');


  document.addEventListener('pointerdown', function(e){
    var target = e.target.closest('button, .choice-btn, .icon-card, .btn-primary, .btn-logout');
    if (!target) return;
    var rect = target.getBoundingClientRect();
    var span = document.createElement('span');
    span.className = 'pro-ripple';
    var size = Math.max(rect.width, rect.height);
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size / 2) + 'px';
    span.style.top = (e.clientY - rect.top - size / 2) + 'px';
    target.appendChild(span);
    setTimeout(function(){ span.remove(); }, 700);
  });
})();
</script>




</body>
</html>
