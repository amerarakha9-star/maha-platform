<style>
:root {
  --france-blue: #0055A4;
  --france-blue-light: #E3F2FD;
  --france-blue-dark: #003366;
  --france-red: #EF4135;
  --france-red-light: #FFEBEE;
  --france-red-dark: #B71C1C;
  --white: #FFFFFF;
  --text-dark: #1A1A2E;
  --text-muted: #6B7B8D;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }
html { width:100%; scrollbar-gutter:stable; }
body { width:100%; min-height:100vh; }
body {
  background: linear-gradient(145deg, var(--white) 0%, var(--france-blue-light) 50%, var(--france-red-light) 100%);
  display:flex; justify-content:center; align-items:center; padding:20px; position:relative;
}

@keyframes floatIn { 0%{opacity:0;transform:translateY(60px) scale(0.9) rotate(-3deg);} 100%{opacity:1;transform:translateY(0) scale(1) rotate(0deg);} }
@keyframes fadeInUp { 0%{opacity:0;transform:translateY(30px);} 100%{opacity:1;transform:translateY(0);} }
@keyframes floatY { 0%,100%{transform:translateY(0px);} 50%{transform:translateY(-12px);} }
@keyframes spinBorder { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
@keyframes borderGlow { 0%,100%{border-color:rgba(0,85,164,0.3);} 50%{border-color:rgba(0,85,164,0.8);} }
@keyframes sparkle { 0%,100%{opacity:1;transform:scale(1) rotate(0deg);} 50%{opacity:0.5;transform:scale(1.3) rotate(180deg);} }
@keyframes blobMove {
  0%,100%{transform:translate(0,0) scale(1) rotate(0deg);border-radius:42% 58% 65% 35%/45% 40% 60% 55%;}
  25%{transform:translate(4vw,-3vh) scale(1.12) rotate(20deg);border-radius:60% 40% 35% 65%/55% 60% 40% 45%;}
  50%{transform:translate(-3vw,4vh) scale(0.92) rotate(-15deg);border-radius:35% 65% 55% 45%/40% 55% 45% 60%;}
  75%{transform:translate(-4vw,-2vh) scale(1.05) rotate(10deg);border-radius:55% 45% 40% 60%/60% 45% 55% 40%;}
}

.floating-decor { position:fixed; font-size:50px; opacity:0.08; pointer-events:none; z-index:0; animation:floatY 6s ease-in-out infinite; }
.floating-decor:nth-child(1){top:5%;left:2%;animation-delay:0s;font-size:70px;color:var(--france-blue);}
.floating-decor:nth-child(2){bottom:8%;right:2%;animation-delay:1.5s;font-size:80px;color:var(--france-red);}
.floating-decor:nth-child(3){top:50%;left:1%;animation-delay:3s;font-size:40px;color:var(--france-blue);}
.floating-decor:nth-child(4){top:30%;right:1%;animation-delay:2s;font-size:55px;color:var(--france-red);}
.floating-decor:nth-child(5){bottom:40%;left:3%;animation-delay:4s;font-size:35px;color:var(--france-blue);}
.floating-decor:nth-child(6){top:70%;right:3%;animation-delay:1s;font-size:45px;color:var(--france-red);}

.blob-bg { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.blob { position:absolute; filter:blur(50px); opacity:0.25; animation:blobMove 16s ease-in-out infinite; }
.blob:nth-child(1){width:38vw;height:38vw;top:-10%;left:-8%;background:radial-gradient(circle at 30% 30%,#A2D9FF,var(--france-blue));animation-duration:18s;}
.blob:nth-child(2){width:30vw;height:30vw;bottom:-12%;right:-6%;background:radial-gradient(circle at 60% 40%,#FFD1DC,var(--france-red));animation-duration:22s;animation-delay:-6s;}
.blob:nth-child(3){width:26vw;height:26vw;top:35%;right:15%;background:radial-gradient(circle at 40% 60%,var(--france-blue-light),#A2D9FF);animation-duration:20s;animation-delay:-10s;}

.container {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  border-radius: 40px;
  padding: 50px 40px 45px;
  max-width: 560px; width:100%;
  box-shadow: 0 25px 60px rgba(0,85,164,0.15), 0 10px 30px rgba(239,65,53,0.1), inset 0 1px 3px rgba(255,255,255,0.8);
  border: 1px solid rgba(255,255,255,0.6);
  position: relative; z-index: 2;
  animation: floatIn 0.8s cubic-bezier(0.34,1.56,0.64,1);
  text-align: center;
  transition: all 0.5s ease;
}
.container:hover { box-shadow: 0 30px 70px rgba(0,85,164,0.25), 0 15px 40px rgba(239,65,53,0.15); }

.logo-wrapper {
  display: inline-block;
  background: linear-gradient(135deg, var(--france-blue), var(--france-blue-dark));
  border-radius: 50%; padding: 12px;
  box-shadow: 0 8px 25px rgba(0,85,164,0.35);
  transition: all 0.5s cubic-bezier(0.34,1.56,0.64,1);
  cursor: pointer; position: relative;
}
.logo-wrapper::after {
  content:''; position:absolute; inset:-5px; border-radius:50%;
  border:3px solid rgba(0,85,164,0.3);
  animation: borderGlow 2s ease-in-out infinite;
}
.logo-wrapper::before {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  background: conic-gradient(from 0deg, var(--france-blue), var(--white), var(--france-red), var(--white), var(--france-blue));
  opacity:0.8; animation: spinBorder 6s linear infinite; z-index:-1; filter:blur(2px);
}
.logo-wrapper:hover { transform: scale(1.08) rotate(-8deg); }
.logo-img {
  width: 100px; height: 100px; background: white; border-radius: 50%;
  display:block; object-fit: contain; padding: 4px;
  animation: floatY 3s ease-in-out infinite;
  box-shadow: inset 0 -3px 10px rgba(0,0,0,0.05);
  position: relative; z-index: 1;
}

h1.title {
  font-size: 28px; margin-top: 18px; color:var(--text-dark); font-weight:800;
  animation: fadeInUp 1s ease-out 0.3s both;
}
h1.title span { color:var(--france-blue); position: relative; }
h1.title span::after {
  content:'✨'; font-size:16px; position:absolute; top:-10px; right:-25px;
  animation: sparkle 3s ease-in-out infinite;
}
p.subtitle { color:var(--text-muted); font-size:14px; font-weight:500; margin-top:6px; animation: fadeInUp 1s ease-out 0.5s both; }

.choice-group { display: flex; flex-direction: column; gap: 14px; margin-top: 32px; animation: fadeInUp 0.6s ease-out 0.4s both; }
.choice-btn {
  width: 100%; padding: 18px 24px;
  border-radius: 60px; font-size: 17px; font-weight: 800;
  cursor: pointer; border: none; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  position: relative; overflow: hidden; color: white;
}
.choice-btn.student { background: linear-gradient(135deg, var(--france-blue), var(--france-blue-dark)); box-shadow: 0 6px 25px rgba(0,85,164,0.35); }
.choice-btn.teacher { background: linear-gradient(135deg, var(--france-red), var(--france-red-dark)); box-shadow: 0 6px 25px rgba(239,65,53,0.35); }
.choice-btn:hover { transform: translateY(-4px) scale(1.02); }
.choice-btn.student:hover { box-shadow: 0 10px 35px rgba(0,85,164,0.5); }
.choice-btn.teacher:hover { box-shadow: 0 10px 35px rgba(239,65,53,0.5); }
.choice-btn:active { transform: scale(0.98); }
.choice-btn i { font-size: 22px; }

.footer-note { margin-top: 28px; color:var(--text-muted); font-size:13px; font-weight:500; animation: fadeInUp 0.6s ease-out 0.6s both; }
.footer-note span { color:var(--france-blue); font-weight:700; }
.footer-note .fb-link { color:#1877f2; font-weight:700; text-decoration:none; transition:opacity .2s; }
.footer-note .fb-link:hover { opacity:.75; text-decoration:underline; }

  -webkit-background-clip: text; background-clip: text;

@keyframes rippleFx { to { transform: scale(3.2); opacity: 0; } }
.pro-ripple {
  position:absolute; border-radius:50%; pointer-events:none;

}
button, .btn-primary, .choice-btn, .btn-logout, .icon-card {

@keyframes cardTiltIn {
  0%   { opacity:0; transform: perspective(800px) rotateX(8deg) translateY(35px) scale(.94); }
  100% { opacity:1; transform: perspective(800px) rotateX(0) translateY(0) scale(1); }
}
.container, .welcome-section, .my-stage-banner, .stat-card, .content-card {

@keyframes glowPulseSoft {
  0%,100% { box-shadow: 0 0 0 rgba(0,0,0,0); }
  50% { box-shadow: 0 0 28px rgba(0,85,164,.2); }
}
.btn-primary, .choice-btn { animation: glowPulseSoft 3.2s ease-in-out infinite; }

/* micro-interaction: gentle lift + glow on any interactive icon card */

  transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease, filter .35s ease;
}
.icon-card:hover, .choice-btn:hover { filter: brightness(1.04) saturate(1.08); }

/* smoother, more premium focus ring */
input:focus, select:focus, textarea:focus {
  outline: none;
}

<script>
/* ================= PRO ENHANCEMENT: particles + ripple + fade-in ================= */
(function(){
  document.body.classList.add('__pro_ready');


  document.addEventListener('pointerdown', function(e){
    var target = e.target.closest('button, .choice-btn, .icon-card, .btn-primary, .btn-logout');
    if (!target) return;
    var rect = target.getBoundingClientRect();
    var span = document.createElement('span');
    span.className = 'pro-ripple';
    var size = Math.max(rect.width, rect.height);
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size / 2) + 'px';
    span.style.top = (e.clientY - rect.top - size / 2) + 'px';
    target.appendChild(span);
    setTimeout(function(){ span.remove(); }, 700);
  });
})();
</script>
